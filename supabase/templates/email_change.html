<!-- Objet : Confirmez votre nouvelle adresse e-mail Pronostics IA -->
<!doctype html>
<html lang="fr">
  <body style="margin:0;padding:24px;background:#f6f6f6;font-family:Arial,Helvetica,sans-serif;color:#1a1a1a;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;margin:0 auto;background:#ffffff;border-radius:8px;padding:24px;">
      <tr>
        <td>
          <h1 style="font-size:20px;margin:0 0 16px;">Changement d'adresse e-mail</h1>
          <p style="font-size:15px;line-height:1.5;margin:0 0 16px;">
            Confirmez le remplacement de {{ .Email }} par {{ .NewEmail }} pour votre compte Pronostics IA :
          </p>
          <p style="margin:0 0 24px;">
            <a href="{{ .SiteURL }}/auth/callback?token_hash={{ .TokenHash }}&type=email_change&next=/profil"
               style="display:inline-block;background:#1a1a1a;color:#ffffff;text-decoration:none;padding:12px 20px;border-radius:6px;font-size:15px;">
              Confirmer la nouvelle adresse
            </a>
          </p>
          <p style="font-size:13px;line-height:1.5;color:#555;margin:0;">
            Vous n'êtes pas à l'origine de cette demande ? Ignorez cet e-mail et changez votre mot de passe.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
