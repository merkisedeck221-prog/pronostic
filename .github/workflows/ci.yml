name: CI

# Vérifications à chaque push sur main et sur les branches de phase,
# et lancement manuel possible (onglet Actions > CI > Run workflow).
on:
  push:
    branches: [main, "phase-*"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, tests unitaires, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  security:
    name: Tests de sécurité (Supabase dev)
    runs-on: ubuntu-latest
    needs: checks
    env:
      # Secrets du dépôt GitHub (Settings > Secrets and variables > Actions),
      # pointant vers le projet Supabase de DÉVELOPPEMENT uniquement.
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_DEV_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_DEV_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_DEV_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_APP_URL: http://localhost:3210
      TEST_APP_PORT: "3210"
      # Secret de TEST du paiement simulé (non sensible : CI uniquement).
      PAYMENT_MOCK_SECRET: ci-only-mock-payment-secret-0123456789abcdef
    steps:
      - name: Vérifier la présence des secrets
        run: |
          missing=0
          for name in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY; do
            if [ -z "${!name}" ]; then echo "::error::Secret manquant pour $name (voir docs/database.md)"; missing=1; fi
          done
          exit $missing
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Build avec les variables du projet DEV : les tests HTTP démarrent `next start`.
      - run: npm run build
      - run: npm run test:security
      # Tests d'intégration obligatoires de la phase 7 (crédits et déblocages).
      - run: npm run test:credits
      # Tests d'intégration obligatoires de la phase 8 (recharges).
      - run: npm run test:payments
